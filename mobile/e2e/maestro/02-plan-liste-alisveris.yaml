# Uçtan uca 2 (Faz 1 ana akışı), misafir olarak: yemek planı kur -> alışveriş listesine aktar -> planı uygula ->
# alışverişi bitir. Bitirme tasarrufu kasaya yazar, bu yüzden misafirden hesap ister (reason=save); hesap açılınca
# aynı liste açık kalır ve alışveriş tamamlanır. Huni olayları sunucuda üretilir (plan_created, plan_to_list,
# shopping_started, shopping_completed); uygulama bu olayları göndermez, akış bunları doğrudan sınamaz.
appId: app.ucuzu
---
- runFlow: subflows/start-guest.yaml
- tapOn: "Alışveriş"
- runFlow: subflows/wait-guest.yaml
- tapOn: "Ana Sayfa"
- tapOn: "Yemek Planı"
- tapOn: "Plan oluştur"
- tapOn:
    text: "(Planı oluştur|\\d+ mutfakla oluştur)"
- extendedWaitUntil:
    visible: "Alışveriş listesine aktar"
    timeout: 120000
- scrollUntilVisible:
    element: "Yeni liste olarak aktar"
- tapOn: "Yeni liste olarak aktar"
# Aktarılan liste açılır
- extendedWaitUntil:
    visible: "En ucuzunu bul"
    timeout: 20000
- tapOn: "En ucuzunu bul"
- scrollUntilVisible:
    element: "Bu planla alışverişe başla"
- tapOn: "Bu planla alışverişe başla"
- scrollUntilVisible:
    element: "Alışverişi bitir"
- tapOn: "Alışverişi bitir"
# Misafir: hesap açma ekranı gelir
- runFlow: subflows/upgrade.yaml
- scrollUntilVisible:
    element: "Alışverişi bitir"
- tapOn: "Alışverişi bitir"
- extendedWaitUntil:
    visible: "Alışveriş tamamlandı"
    timeout: 30000
