# Uçtan uca 2 (Faz 1 ana akışı): yemek planı kur -> alışveriş listesine aktar -> planı uygula -> alışverişi bitir.
# Her adım huni olaylarını (plan_created, plan_to_list, shopping_started, shopping_completed) üretir.
appId: app.ucuzu
---
- launchApp:
    clearState: true
- runFlow: subflows/login.yaml
- tapOn: "Ana Sayfa"
- tapOn: "Yemek Planı"
- tapOn: "Plan oluştur"
- tapOn:
    text: "Planı oluştur"
    optional: true
- extendedWaitUntil:
    visible: "🛒 Alışveriş listesine aktar"
    timeout: 30000
- scrollUntilVisible:
    element: "Yeni liste olarak aktar"
- tapOn: "Yeni liste olarak aktar"
# Aktarılan liste açılır
- extendedWaitUntil:
    visible: "Planları gör"
    timeout: 20000
- tapOn: "Planları gör"
- scrollUntilVisible:
    element: "🛒 Bu planı alışveriş listeme uygula"
- tapOn: "🛒 Bu planı alışveriş listeme uygula"
- scrollUntilVisible:
    element: "✅ Alışverişi Bitir ve Tasarrufu Kaydet"
- tapOn: "✅ Alışverişi Bitir ve Tasarrufu Kaydet"
- assertVisible: "Alışveriş tamamlandı"
