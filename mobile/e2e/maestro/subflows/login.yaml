# Var olan demo hesabıyla giriş (backend: python -m app.cli seed-demo). Misafir olarak başlamış olmak gerekir
# (start-guest.yaml). Giriş, Profil'deki "Hesap aç" kartından açılan ekranda "Giriş yap" sekmesiyle yapılır;
# misafir verileri bu hesaba taşınmaz (ekranda uyarı çıkar).
appId: app.ucuzu
---
- runFlow:
    when:
      visible: "Bugün ne yapmak istersiniz?"
    commands:
      - tapOn: "Alışveriş"
- runFlow: wait-guest.yaml
- tapOn: "Hesap aç"
# Başlıkta da "Giriş yap" yazar; sekme logonun altındadır
- tapOn:
    text: "Giriş yap"
    below: "Ucuzu"
- assertVisible: "Dikkat: Var olan hesabınıza girerseniz.*"
- tapOn: "E-posta"
- inputText: "demo@marketkiyas.app"
- tapOn: "Şifre (en az 8 karakter)"
- inputText: "demo1234"
# Şifre alanı onSubmitEditing ile gönderir; "Giriş yap" metni ekranda 3 yerde olduğu için düğmeye dokunmuyoruz
- pressKey: Enter
- assertVisible: "demo@marketkiyas.app"
