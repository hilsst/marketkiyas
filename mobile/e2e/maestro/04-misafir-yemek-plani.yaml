# Uçtan uca 4: misafir yemek planı. Karşılama ekranından planlayıcı giriş istemeden açılır, plan kurulur,
# "Planınızı kaydedin" kartı çıkar; karttan hesap açılınca plan aynı hesapta kalır ve kart kaybolur.
appId: app.ucuzu
---
- runFlow: subflows/start-guest.yaml
# Karşılama ekranındaki "Yemek Planı" seçeneği (başlık aynı metinle başka yerde de geçtiği için açıklamasından seçilir)
- tapOn: "1-14 günlük menü.*"
# Açılan pencerede nasıl bir plan istendiği sorulur: mutfak seçerek kur
- tapOn: "Mutfak seçerek kur"
- extendedWaitUntil:
    visible: "Yeni plan"
    timeout: 60000
- assertNotVisible: "Yemek planı yapmak için giriş yapın ya da ücretsiz üye olun."
- tapOn: "Plan oluştur"
# Mutfak seçimi: varsayılan seçimde 1 mutfak varsa "Planı oluştur", birden çoksa "N mutfakla oluştur" yazar
- tapOn:
    text: "(Planı oluştur|\\d+ mutfakla oluştur)"
- extendedWaitUntil:
    visible: "Planınızı kaydedin"
    timeout: 120000
- assertVisible: "Alışveriş listesine aktar"
- tapOn: "Planınızı kaydedin"
- runFlow: subflows/upgrade.yaml
# Giriş ekranı kapanır, plan ekranına dönülür: misafir kartı gitmiş olmalı
- extendedWaitUntil:
    notVisible: "Planınızı kaydedin"
    timeout: 30000
- assertVisible: "Alışveriş listesine aktar"
# Hesap açılmış: Profil'de e-posta ve çıkış var
# Planlayıcıdan sekmelere iki adım geri (plan -> Yemek Planı -> sekmeler)
- back
- back
- tapOn: "Profil"
- assertVisible: "Çıkış yap"
- assertNotVisible: "Misafir"
