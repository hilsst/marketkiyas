services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketkiyas
      POSTGRES_PASSWORD: marketkiyas
      POSTGRES_DB: marketkiyas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketkiyas -d marketkiyas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@db:5432/marketkiyas
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app

  # Kullanıcıların seçtiği şubelerin fiyatlarını 6 saatte bir marketfiyati.org.tr'den günceller
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # migration'ları api çalıştırır
    environment:
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@db:5432/marketkiyas
    entrypoint: []
    command: ["python", "-m", "app.cli", "sync-selected", "--every-hours", "6"]

  # BİM ve Şok aktüel (broşür) ürünlerini 12 saatte bir toplar
  aktuel:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@db:5432/marketkiyas
    entrypoint: []
    command: ["python", "-m", "app.cli", "aktuel", "--every-hours", "12"]

  # Şok sitesinden 12 saatte bir fiyat toplar (A101 varsayılan kapalı). marketfiyati'ya erişilemediğinde kullanılır.
  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@db:5432/marketkiyas

  # Next.js arayüzü: http://localhost:3000 (geliştirme modu, kod değişince yenilenir)
  web:
    image: node:20-alpine
    restart: unless-stopped
    depends_on:
      - api
    working_dir: /app
    environment:
      # Tarayıcı API'ye doğrudan bağlanır, bu yüzden adres bilgisayarınızdaki port
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    command: ["sh", "-c", "npm ci && npm run dev -- -H 0.0.0.0"]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules

volumes:
  pgdata:
  web_node_modules:
