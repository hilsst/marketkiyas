services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketkiyas
      POSTGRES_PASSWORD: marketkiyas
      POSTGRES_DB: marketkiyas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketkiyas -d marketkiyas"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@db:5432/marketkiyas
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app

  # Kullanıcıların seçtiği şubelerin fiyatlarını 6 saatte bir marketfiyati.org.tr'den günceller
  worker:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # migration'ları api çalıştırır
    environment:
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@db:5432/marketkiyas
    entrypoint: []
    command: ["python", "-m", "app.cli", "sync-selected", "--every-hours", "6"]

  # Market sitelerinden (Şok, A101) 12 saatte bir fiyat toplar. marketfiyati'ya erişilemediğinde kullanılır.
  scraper:
    build:
      context: ./backend
      dockerfile: Dockerfile.scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@db:5432/marketkiyas

  # Sonraki adım: Next.js frontend servisi buraya eklenecek

volumes:
  pgdata:
