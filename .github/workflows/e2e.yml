# Uçtan uca (Maestro) testleri: Android emülatöründe. Emülatör yavaştır (~15-25 dk), bu yüzden her PR'da değil,
# elle ve haftalık çalışır. APK'yı EAS ya da `expo run:android` üretir; burada `expo prebuild` + Gradle ile derlenir.
name: e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketkiyas
          POSTGRES_PASSWORD: marketkiyas
          POSTGRES_DB: marketkiyas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketkiyas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@localhost:5432/marketkiyas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Sunucu
        working-directory: backend
        run: |
          pip install -r requirements.txt
          alembic upgrade head
          python -m app.cli seed-demo
          python -m loadtest.seed_catalog
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break || sleep 1; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: APK (emülatörden sunucuya 10.0.2.2)
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://10.0.2.2:8000/api
        run: |
          npm ci
          npx expo prebuild --platform android --no-install
          # Release derlemesi düz HTTP'yi engeller; yalnız bu test APK'sı emülatördeki sunucuya http ile bağlanır
          sed -i 's/<application /<application android:usesCleartextTraffic="true" /' android/app/src/main/AndroidManifest.xml
          (cd android && ./gradlew assembleRelease -x lint --no-daemon)
      - name: Maestro kur
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install mobile/android/app/build/outputs/apk/release/app-release.apk
            maestro test --format junit --output maestro-report.xml mobile/e2e/maestro
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: maestro-report.xml
