# Yük testi (Faz 1 kapısı: 1.000 eşzamanlı kullanıcıda okuma uçları p95 < 300 ms).
# GitHub'ın 4 çekirdekli koşucusunda sunucu, veritabanı ve Locust aynı makinede çalışır; bu yüzden 1.000
# kullanıcılık sonuç kapı için güvenilir değildir. Kapı ölçümü hedef sunucuya karşı yapılır (target_url verilirse).
# Locust her isteğe X-Load-Test başlığı koyar; sunucu bu istekleri analitiğe yazmaz. Yine de gerçek bir
# sunucuya karşı çalıştırınca binlerce deneme hesabı açılır: yalnız hazırlık (staging) ortamına yönelt.
# Haftalık çalışan küçük sürüm (50 kullanıcı) gerilemeleri yakalamak içindir.
name: load

on:
  workflow_dispatch:
    inputs:
      users: { description: "Eşzamanlı kullanıcı", default: "1000" }
      spawn_rate: { description: "Saniyede yeni kullanıcı", default: "25" }
      duration: { description: "Süre", default: "3m" }
      target_url: { description: "Boşsa koşucuda kurulan sunucu; doluysa bu adres (ör. https://api.ucuzu.app)", default: "" }
  schedule:
    - cron: "0 3 * * 1"

jobs:
  locust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketkiyas
          POSTGRES_PASSWORD: marketkiyas
          POSTGRES_DB: marketkiyas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketkiyas" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://marketkiyas:marketkiyas@localhost:5432/marketkiyas
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-load.txt
      - name: Veritabanı ve yük katalogu
        if: ${{ inputs.target_url == '' }}
        run: |
          alembic upgrade head
          python -m app.cli seed-demo
          python -m loadtest.seed_catalog
      - name: Sunucuyu başlat
        if: ${{ inputs.target_url == '' }}
        run: |
          nohup uvicorn app.main:app --port 8000 --workers 4 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break || sleep 1; done
      - name: Locust
        run: |
          locust -f loadtest/locustfile.py --headless \
            -u "${{ inputs.users || '50' }}" -r "${{ inputs.spawn_rate || '5' }}" -t "${{ inputs.duration || '60s' }}" \
            --host "${{ inputs.target_url || 'http://localhost:8000' }}" --csv loadtest-result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locust-result
          path: backend/loadtest-result*.csv
